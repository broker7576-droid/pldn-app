# PLDN-FAYL: build-apk.yml | versiya: kino-bg-1.2 | satr: 172 | 26-okt-2026
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Compute version
        run: |
          tr -d '\r' < version.txt > /tmp/version.env
          source /tmp/version.env
          CODE=$((versionCode + GITHUB_RUN_NUMBER))
          NAME="${versionName%.*}.$(printf '%03d' "$GITHUB_RUN_NUMBER")"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Version: $NAME ($CODE)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare web folder
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp three.min.js www/three.min.js
          cp livekit-client.umd.min.js www/livekit-client.umd.min.js
          sed -i "s/__PLDN_BUILD__/$VERSION_CODE/" www/index.html
          sed -i "1s/^<!-- VERSION:.*/<!-- VERSION: $VERSION_CODE -->/" www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Add google-services.json
        run: |
          F=$(ls google-services*.json | head -1)
          echo "Using $F"
          cp "$F" android/app/google-services.json

      - name: Fix Gradle version bug
        run: |
          sed -i -E 's#gradle-[0-9.]+-all\.zip#gradle-8.9-all.zip#' android/gradle/wrapper/gradle-wrapper.properties

      - name: Generate app icon
        run: npx capacitor-assets generate --android

      - name: Apply version
        run: |
          sed -i "s/versionCode 1/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle

      - name: Force fixed debug signing
        run: |
          cp debug.keystore android/app/debug.keystore
          echo 'android.signingConfigs.debug.storeFile = file("debug.keystore")' >> android/app/build.gradle
          echo 'android.signingConfigs.debug.storePassword = "android"' >> android/app/build.gradle
          echo 'android.signingConfigs.debug.keyAlias = "androiddebugkey"' >> android/app/build.gradle
          echo 'android.signingConfigs.debug.keyPassword = "android"' >> android/app/build.gradle

      - name: Add microphone, camera, contacts, phone, SMS and location permission
        run: |
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n<uses-permission android:name="android.permission.READ_CONTACTS" />\n<uses-permission android:name="android.permission.WRITE_CONTACTS" />\n<uses-permission android:name="android.permission.CAMERA" />\n<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n<uses-permission android:name="android.permission.CALL_PHONE" />\n<uses-permission android:name="android.permission.SEND_SMS" />\n<uses-permission android:name="android.permission.SET_ALARM" />\n<uses-feature android:name="android.hardware.telephony" android:required="false" />\n<uses-feature android:name="android.hardware.camera" android:required="false" />\n<uses-feature android:name="android.hardware.microphone" android:required="false" />\n<queries><intent><action android:name="android.speech.RecognitionService" /></intent><intent><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent></queries>\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Fix microphone permission in WebView
        run: |
          MAINACT=$(find android/app/src/main/java -name MainActivity.java)
          PKG=$(grep applicationId android/app/build.gradle | head -1 | sed -E 's/.*"(.*)".*/\1/')
          cat native/MainActivity.txt | sed "s/__PKG__/$PKG/" > "$MAINACT"
     
      - name: Add PLDN Start wake service (permissions, service, Vosk)
        run: |
          PKG=$(grep applicationId android/app/build.gradle | head -1 | sed -E 's/.*"(.*)".*/\1/')
          JAVADIR=$(dirname "$(find android/app/src/main/java -name MainActivity.java)")
          sed "s/__PKG__/$PKG/" native/PldnWakeService.java > "$JAVADIR/PldnWakeService.java"
          sed "s/__PKG__/$PKG/" native/PldnLock.java > "$JAVADIR/PldnLock.java"
          sed "s/__PKG__/$PKG/" native/PldnPocket.java > "$JAVADIR/PldnPocket.java"
          sed "s/__PKG__/$PKG/" native/PldnAlarmReceiver.java > "$JAVADIR/PldnAlarmReceiver.java"
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          sed -i "s#</application>#<receiver android:name=\"$PKG.PldnAlarmReceiver\" android:exported=\"false\" />\n</application>#" android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />\n<uses-permission android:name="android.permission.WAKE_LOCK" />\n<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          sed -i "s#</application>#<service android:name=\"$PKG.PldnWakeService\" android:exported=\"false\" android:foregroundServiceType=\"microphone\" />\n</application>#" android/app/src/main/AndroidManifest.xml
          echo "dependencies { implementation 'com.alphacephei:vosk-android:0.3.47' }" >> android/app/build.gradle
          echo "android { defaultConfig { ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' } } }" >> android/app/build.gradle
          grep -n "PldnWakeService" android/app/src/main/AndroidManifest.xml

      - name: Add Kinozona background upload service
        run: |
          PKG=$(grep applicationId android/app/build.gradle | head -1 | sed -E 's/.*"(.*)".*/\1/')
          JAVADIR=$(dirname "$(find android/app/src/main/java -name MainActivity.java)")
          sed "s/__PKG__/$PKG/" native/PldnUploadService.java > "$JAVADIR/PldnUploadService.java"
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          sed -i "s#</application>#<service android:name=\"$PKG.PldnUploadService\" android:exported=\"false\" android:foregroundServiceType=\"dataSync\" />\n</application>#" android/app/src/main/AndroidManifest.xml
          grep -n "PldnUploadService\|DATA_SYNC" android/app/src/main/AndroidManifest.xml

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Cache Vosk model
        uses: actions/cache@v4
        with:
          path: /tmp/vosk-model.zip
          key: vosk-model-small-en-us-0.15

      - name: Add Vosk model
        run: |
          [ -s /tmp/vosk-model.zip ] || curl -fL --retry 3 -o /tmp/vosk-model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          rm -rf /tmp/vosk-model && mkdir -p /tmp/vosk-model
          unzip -q /tmp/vosk-model.zip -d /tmp/vosk-model
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/vosk-model
          mv /tmp/vosk-model/vosk-model-small-en-us-0.15 android/app/src/main/assets/vosk-model
          test -f android/app/src/main/assets/vosk-model/conf/model.conf

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Print APK signing fingerprint
        run: |
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pldn-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk pldn-app.apk
          if [ -s changelog.txt ]; then
            tr -d '\r' < changelog.txt > /tmp/notes.txt
          else
            echo "Build $VERSION_CODE" > /tmp/notes.txt
          fi
          gh release create "v$VERSION_CODE" pldn-app.apk --repo "${{ github.repository }}" --title "PLDN $VERSION_NAME" --notes-file /tmp/notes.txt --latest

      - name: Stamp version in repo
        run: |
          sed -i "1s/^<!-- VERSION:.*/<!-- VERSION: $VERSION_CODE -->/" index.html
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          : > changelog.txt
          git add index.html changelog.txt
          git commit -m "Version $VERSION_CODE [skip ci]" || exit 0
          git push origin HEAD:main || (git fetch origin main && git rebase origin/main && git push origin HEAD:main) || true

          
