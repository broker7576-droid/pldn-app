name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web folder
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icon
        run: npx capacitor-assets generate --android

      - name: Apply version
        run: |
          source version.txt
          sed -i "s/versionCode 1/versionCode $versionCode/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$versionName\"/" android/app/build.gradle

      - name: Force fixed debug signing
        run: |
          cp debug.keystore android/app/debug.keystore
          echo 'android.signingConfigs.debug.storeFile = file("debug.keystore")' >> android/app/build.gradle
          echo 'android.signingConfigs.debug.storePassword = "android"' >> android/app/build.gradle
          echo 'android.signingConfigs.debug.keyAlias = "androiddebugkey"' >> android/app/build.gradle
          echo 'android.signingConfigs.debug.keyPassword = "android"' >> android/app/build.gradle

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Print APK signing fingerprint
        run: |
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pldn-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
